[package]
name = "cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "CLI command implementations, thin layer on core / daemon client"

[dependencies]
localdb-core = { path = "../core", version = "=0.1.0" }
store-libsql = { path = "../store-libsql", version = "=0.1.0" }
extract = { path = "../extract", version = "=0.1.0" }
ingest = { path = "../ingest", version = "=0.1.0" }
embed = { path = "../embed", version = "=0.1.0", features = ["local-onnx"] }
fetch = { path = "../fetch", version = "=0.1.0" }
mcp = { path = "../mcp", version = "=0.1.0" }
server = { path = "../server", version = "=0.1.0" }
tokio = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
clap_complete = "4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
indicatif = { workspace = true }
percent-encoding = { workspace = true }
# `bytes_stream()` on a `reqwest::Response` yields a `futures_util::Stream`
# (re-exported by `futures`, already a pinned workspace dependency used by
# `server` for its own SSE stream) — hand-rolling the `GET
# /v1/jobs/{id}/events` SSE line parser in `job_attach.rs` needs `StreamExt`
# to poll it.
futures = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
# On macOS, auto-enable CoreML so any localdb build (release tarball or cargo install)
# picks up ANE/GPU acceleration without needing --features. Cargo unions this with the
# local-onnx feature above; Linux never pulls objc2/block2/etc.
embed = { path = "../embed", version = "=0.1.0", features = ["local-coreml"] }

[dev-dependencies]
tempfile = { workspace = true }
# Real-server test harnesses for `job_attach.rs`'s daemon-routed paths
# (submit/attach/SSE/poll-fallback error branches): both a real
# `server::daemon::build_router` instance and a small hand-rolled mock router
# for wire-shape edge cases the real daemon can't be coaxed into producing
# (a malformed `/v1/jobs` response, a dropped SSE stream). `axum` is already
# resolved in the dependency graph via `server`'s own (non-dev) dependency on
# it — this only newly depends on it directly for test code.
axum = { workspace = true }

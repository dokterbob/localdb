[package]
name = "localdb"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Local-first knowledge server — single binary with embedded store and MCP/CLI surfaces"

[[bin]]
name = "localdb"
path = "src/main.rs"

[dependencies]
localdb-cli = { path = "../cli", version = "0.1.0" }
clap = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
tracing-subscriber = { workspace = true }

[build-dependencies]
vergen-gitcl = { version = "10", features = ["build"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = { workspace = true }
serde_json = { workspace = true }
libsql = { workspace = true }
localdb-core = { path = "../core" }
# In-process MCP tool-schema generation for the `DateAxis::describe()`
# consistency test (issue #247) — asserts the clap `--help` text and the MCP
# `search` tool schema both contain each axis's `describe()` text.
localdb-mcp = { path = "../mcp" }
schemars = { workspace = true }
# RFC 3339 cutoff timestamps for the added/updated-axis filter fixtures in
# cli_search_filters.rs. Already a workspace dependency; no new crate.
chrono = { workspace = true }

# Aligned with prettier (.prettierrc): prose wraps at 100 columns via
# `qlty fmt`. Tables and code blocks are exempt from the length check because
# prettier cannot wrap them.
MD013:
  line_length: 100
  heading_line_length: 100
  code_blocks: false
  tables: false

# prettier owns table formatting (it aligns all pipe tables on `qlty fmt`);
# markdownlint's own notion of column style disagrees with prettier's output,
# so the style check is redundant noise here.
MD060: false

# These docs are full of "issue #83"-style references, and prettier may wrap
# one to the start of a line. MD018's auto-fix then rewrites `#83)` into the
# heading `# 83)` — real corruption we've had to repair. A wrapped issue ref
# is prose, not a malformed heading; genuine `#Heading` typos are far rarer
# than issue refs here, so the rule is off.
MD018: false

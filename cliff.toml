# git-cliff configuration — Common Changelog style (https://common-changelog.org).
#
# Single source of truth for changelog rendering: used by the `git-cliff` CLI
# locally and by release-plz (via `changelog_config` in release-plz.toml) when
# it maintains the release PR's CHANGELOG.md.
#
# Grouping relies on the repo's imperative commit style (see CLAUDE.md
# "Commit style"): first-word heuristics map commits onto Common Changelog's
# Added/Changed/Fixed/Removed groups; conventional-commit prefixes are also
# recognized for robustness. Maintenance commits (chore/ci/docs/test/style,
# merges, release commits) are skipped.

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.

The format follows [Common Changelog](https://common-changelog.org).
"""
# Common Changelog: `## [x.y.z] - yyyy-mm-dd`, one imperative one-liner per
# change, each linking its commit; groups in fixed order.
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim }} \
([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/dokterbob/localdb/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
# The repo does not use conventional commits (imperative style, `TXX:` ticket
# prefixes) — parse the raw message.
conventional_commits = false
filter_unconventional = false
split_commits = false
protect_breaking_commits = false
filter_commits = false
# Only bare vX.Y.Z tags delimit releases (release-plz produces exactly
# these); deliberately anchored so legacy tags like v0.1.0pre8 don't count.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"

# Ordered: first match wins. `<!-- N -->` prefixes force Common Changelog's
# group order (Changed, Added, Removed, Fixed) in the rendered output; the
# body template strips them via `striptags`.
commit_parsers = [
    # Skips: maintenance noise and machine-generated commits.
    { message = "^(chore|ci|docs|test|tests|style|build|release)[(:!]", skip = true },
    { message = "^(Merge|Revert \"Merge)", skip = true },
    { message = "^chore\\(release\\)", skip = true },
    { message = "(?i)^(Bump|Update) .*(dependency|dependencies|deps)", skip = true },
    { message = "(?i)^Document ", skip = true },
    # Conventional-commit prefixes, if they ever appear.
    { message = "^feat[(:!]", group = "<!-- 1 -->Added" },
    { message = "^fix[(:!]", group = "<!-- 3 -->Fixed" },
    { message = "^(perf|refactor)[(:!]", group = "<!-- 0 -->Changed" },
    # Imperative first-word heuristics (repo house style).
    { message = "(?i)^(Add|Introduce|Implement) ", group = "<!-- 1 -->Added" },
    { message = "(?i)^(Fix|Correct|Repair|Address) ", group = "<!-- 3 -->Fixed" },
    { message = "(?i)^(Remove|Drop|Delete) ", group = "<!-- 2 -->Removed" },
    # Everything else is a change.
    { message = ".*", group = "<!-- 0 -->Changed" },
]

[remote.github]
owner = "dokterbob"
repo = "localdb"

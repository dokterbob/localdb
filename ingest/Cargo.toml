[package]
name = "localdb-ingest"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Content-acquisition ingestors implementing core::ingestor::Ingestor (file, URL)"

[lib]
# Keep the short crate name in code (`use ingest::…`); only the
# package name is namespaced (crates.io collision hygiene — see docs/release-engineering.md).
name = "ingest"

[dependencies]
localdb-core = { path = "../core", version = "0.2.0" }
localdb-extract = { path = "../extract", version = "0.2.0" }
localdb-fetch = { path = "../fetch", version = "0.2.0" }
async-trait = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
feed-rs = { version = "2", features = ["sanitize"] }
mediatype = "0.21"

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
tempfile = "3"
localdb-core = { path = "../core", features = ["test-support"] }

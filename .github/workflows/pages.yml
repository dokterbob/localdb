name: Pages

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: docs
          destination: _site
      - name: Check links (built site)
        # Runs only here, not in ci.yml's offline pass: this checks external
        # links too (no --offline), and only after Jekyll has resolved the
        # `_site/**/*.html` Liquid templating that ci.yml's source-only pass
        # deliberately skips (docs/index.md, docs/_layouts/**). This job only
        # runs on main-branch pushes/dispatch, so external-link flakiness never
        # blocks a PR.
        uses: lycheeverse/lychee-action@v2
        with:
          # `_site` lands at the repo root (destination: _site above, relative
          # to the default working directory), so the default workingDirectory
          # ('.') already covers it — no override needed.
          args: >-
            --include-fragments --no-progress
            '_site/**/*.html'
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy docs
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Pages

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
      - "lychee.toml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: docs
          destination: _site
      - name: Stage site under its base path
        # Jekyll writes to `_site` at the repo root, but the pages served
        # under `configure-pages`' `base_path` (e.g. `/localdb`) contain
        # root-relative links like `/localdb/architecture.html` — lychee can
        # only resolve a root-relative link against a `--root-dir`, and that
        # root-dir has to actually contain the `base_path` prefix on disk for
        # the resolved path to exist. Moving `_site` under
        # `site-root<base_path>` makes `site-root` that root-dir.
        run: |
          target="site-root${{ steps.pages.outputs.base_path }}"
          mkdir -p "$(dirname "$target")"
          mv _site "$target"
      - name: Check links (built site)
        # Runs here, not in ci.yml's offline `link-check` job: this checks
        # after Jekyll has resolved the Liquid templating that ci.yml's
        # source-only pass deliberately skips (docs/index.md,
        # docs/_layouts/**), and it resolves root-relative links via
        # `--root-dir` against the staged `site-root` tree (see previous
        # step). On `push`/`workflow_dispatch` it also checks external links
        # (no `--offline`); on `pull_request` it stays offline so a
        # rate-limited external site never blocks a PR — root-relative
        # resolution is exercised either way.
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            ${{ github.event_name == 'pull_request' && '--offline' || '' }}
            --include-fragments --no-progress
            --root-dir "${{ github.workspace }}/site-root"
            'site-root/**/*.html'
      - name: Upload artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-root${{ steps.pages.outputs.base_path }}

  deploy:
    name: Deploy docs
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

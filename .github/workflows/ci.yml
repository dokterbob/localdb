name: CI

on:
  push:
    branches: ["main", "ticket/**"]
  # No base-branch filter: a stacked PR targets its parent branch rather than
  # `main`, and filtering on the base would leave exactly those PRs with no
  # checks at all — the ones carrying work that has not been merged anywhere
  # yet, and so the ones least safe to leave unverified.
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable with clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-
      - name: Run clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # OIDC for the Qlty coverage upload (no token secret)
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable with llvm-tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-coverage-
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Run coverage (all tests)
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Upload coverage to Qlty
        uses: qltysh/qlty-action/coverage@v2
        with:
          oidc: true
          files: lcov.info
          fail_ci_if_error: false

  coreml:
    name: CoreML backend (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable with clippy
        # @stable satisfies the local-coreml MSRV of Rust 1.85.
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-coreml-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-coreml-
      - name: Build embed with local-coreml
        run: cargo build -p localdb-embed --features local-coreml
      - name: Run embed tests with local-coreml
        # Pure logic/unit tests run without a model. Device/network/parity tests
        # are #[ignore]d, so plain `cargo test` does not hit the network or load a
        # CoreML bundle; run those manually against a cached bundle.
        run: cargo test -p localdb-embed --features local-coreml
      - name: Run clippy with local-coreml (deny warnings)
        run: cargo clippy -p localdb-embed --features local-coreml --all-targets -- -D warnings

  windows:
    name: Windows-only branches (scoped tests)
    # `#[cfg(windows)]` code never compiles on the Linux `test` job, so it is
    # invisible to the coverage gate and would rot unnoticed without a lane that
    # actually compiles and runs it. Scoped to the crates that carry Windows-only
    # behaviour: the daemon sentinel in `server`, path/URI handling in `core`, and
    # the embedded ONNX Runtime in `embed` (#239).
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable with clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-windows-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-windows-
      - name: Run tests
        # --no-fail-fast: a Windows failure usually means a portability
        # assumption nobody had reason to question, and there is rarely just
        # one. Stopping at the first crate would surface them a runner round
        # trip at a time.
        run: cargo test --no-fail-fast -p localdb-core -p localdb-server
      - name: Run embed tests against the embedded ONNX Runtime
        # The session tests in `embed/src/onnx.rs` are the only thing that
        # actually dlopens the extracted `onnxruntime.dll` and builds a real ORT
        # session, so this step is what shows the Windows runtime *works* rather
        # than merely compiles — including whether a CPU-only session needs
        # `onnxruntime_providers_shared.dll`, which we deliberately do not embed.
        #
        # `local-onnx` is not a default feature, and without it `build.rs` embeds
        # nothing and every one of those tests cfgs out: a green vacuum. Kept a
        # separate step from the one above so a single `--features` applies
        # unambiguously to the one package that has it.
        run: cargo test --no-fail-fast -p localdb-embed --features local-onnx
      - name: Run clippy (deny warnings)
        run: |
          cargo clippy -p localdb-core -p localdb-server --all-targets -- -D warnings
          cargo clippy -p localdb-embed --features local-onnx --all-targets -- -D warnings

  # Demonstrate the coverage gate: this job has a dummy function with a test.
  # The function and test live in the core crate (error.rs / tests).
  # If tests are removed, coverage will drop and the coverage job will fail.
  build-all-platforms:
    name: Cross-compile check (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            packages: "-p localdb"
          # Pinned to ubuntu-22.04 (not ubuntu-latest): our own Rust code inherits the
          # build machine's glibc floor, and this job now actually links (see the `cargo
          # build` step below), so a stale ubuntu-latest pin here would let a #133-style
          # glibc regression slip through CI again.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            packages: "-p localdb"
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            packages: "-p localdb"
          # Pinned to windows-2022 for the same reason the Linux entries pin
          # ubuntu-22.04: windows-latest now maps to Windows Server 2025 + VS 2026,
          # a moving toolchain target.
          #
          # `-p localdb` here is doing more than a compile check: `cli` enables
          # `local-onnx` on every target, so building the binary runs `embed`'s
          # build script, which downloads the Windows ONNX Runtime zip, verifies it
          # against its pinned sha256, and embeds `onnxruntime.dll`. That is the
          # only place the zip-extraction branch runs against the real asset.
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            packages: "-p localdb"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cross-compilation tools (aarch64-linux only)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-
      - name: Build localdb for target
        # `cargo check` never links, so it can't catch link-time/runtime issues like #133
        # (the GLIBC_2.38 floor from ort-sys's static archive) — that regression escaped CI
        # because this job used to only `cargo check`. Actually build+link the release
        # binary for each target instead.
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }} ${{ matrix.packages }}

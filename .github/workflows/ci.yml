name: CI

on:
  push:
    branches: ["main", "ticket/**"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable with clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-
      - name: Run clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
      - name: Cache downloaded ONNX Runtime CPU flavor
        # `cli` unconditionally enables embed's `local-onnx` feature, and several embed unit
        # tests (e.g. onnx.rs's `onnx_embedder_returns_correct_dim`) construct a real
        # `OnnxEmbedder`, which calls `ensure_ort_initialized` for real. On a cold cache this
        # performs a one-time ~8 MB download+verify of the pinned ORT CPU tarball from GitHub
        # (runtime-download model, issue #76 — pre-#76 this runtime was embedded at build time,
        # so no such download existed). Caching `~/.cache/localdb/ort` here removes the
        # GitHub-release dependency from `cargo test --workspace`'s critical path on every run
        # after the first.
        uses: actions/cache@v4
        with:
          path: ~/.cache/localdb/ort
          key: ort-1.24.4-cpu-3a211fbea252
      - name: Build workspace
        run: cargo build --workspace
      - name: Run tests
        run: cargo test --workspace

  coverage:
    name: Coverage gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable with llvm-tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-coverage-
      - name: Cache downloaded ONNX Runtime CPU flavor
        # Same rationale as the `test` job above: the workspace test suite (run here under
        # `cargo llvm-cov`) performs a one-time ORT CPU download on a cold cache because `cli`
        # unconditionally enables embed's `local-onnx` feature, whose unit tests construct a
        # real `OnnxEmbedder` (runtime-download model, issue #76). Caching
        # `~/.cache/localdb/ort` removes the GitHub-release dependency from this job's critical
        # path on every run after the first.
        uses: actions/cache@v4
        with:
          path: ~/.cache/localdb/ort
          key: ort-1.24.4-cpu-3a211fbea252
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Run coverage (all tests)
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Check coverage gates
        # Gate: ≥80% line coverage across the workspace.
        # Data-modifying paths should hit ≥90% but this workspace-level gate
        # is enforced at 80%; per-crate gates are checked per ticket via the
        # summary report.
        run: |
          cargo llvm-cov report --summary-only
          # Fail if line coverage drops below 80%.
          COVERAGE=$(cargo llvm-cov report --summary-only 2>/dev/null \
            | grep 'TOTAL' | awk '{print $10}' | tr -d '%')
          echo "Workspace line coverage: ${COVERAGE}%"
          if [ -z "$COVERAGE" ]; then
            echo "ERROR: Could not parse coverage output."
            exit 1
          fi
          if [ "$(echo "$COVERAGE < 80" | bc -l)" = "1" ]; then
            echo "ERROR: Coverage ${COVERAGE}% is below the 80% gate."
            exit 1
          fi
      - name: Upload coverage to Codecov (informational)
        uses: codecov/codecov-action@v4
        if: github.event_name == 'pull_request'
        with:
          files: lcov.info
          fail_ci_if_error: false

  ort-download:
    name: ORT runtime download (Linux, GPU-less)
    # Deliberately GPU-less (ubuntu-22.04, not a GPU runner): this job exists to prove the CUDA
    # flavor downloads/verifies/dlopens cleanly and fails *cleanly* (no panic/abort) when asked
    # to actually register the CUDA execution provider with no GPU present — see
    # `embed/tests/cuda_probe_gpuless.rs`. Pinned to 22.04 (not ubuntu-latest) because this job's
    # glibc-floor assertion step below is what now guarantees the downloaded libraries stay
    # within the Ubuntu 22.04 / glibc 2.35 support floor (issue #133) on every PR — that
    # guarantee used to live in the release workflow as an objdump check of the *embedded*
    # library; issue #76 replaced build-time embedding with this runtime download, so the check
    # moved here and now runs against real downloaded artifacts instead.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable with clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-ort-download-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ort-download-
      - name: Cache downloaded ONNX Runtime flavors
        uses: actions/cache@v4
        with:
          path: ~/.cache/localdb/ort
          # Keyed on the pinned ORT version plus the first 12 hex chars of both the CPU-linux-x64
          # and CUDA-linux-x64 tarball sha256s (embed/src/ort_download.rs) — not just the version
          # string — so bumping either pin (a new ORT release, or a corrected hash) invalidates
          # the cache instead of silently reusing stale/mismatched bytes.
          #
          # This step does NOT help the "Download + verify" step immediately below — that step
          # (`real_download`) downloads into its own TempDir every run, on purpose: re-downloading
          # from GitHub and re-verifying the sha256 from scratch *is* the behavior under test.
          # What this cache actually speeds up is the two steps after it, "Real ort::init_from
          # against the downloaded CPU flavor" and "CUDA execution-provider probe fails cleanly
          # without a GPU" — those read/write the real `~/.cache/localdb/ort` cache dir via
          # `ensure_ort_initialized`, so restoring it here avoids re-fetching the ~8 MB CPU and
          # ~196 MB CUDA tarballs from GitHub on every CI run.
          key: ort-1.24.4-cpu-3a211fbea252-cuda-c5f804ff5d23
      - name: Download + verify CPU and CUDA ONNX Runtime flavors (real network)
        env:
          LOCALDB_TEST_ORT_DOWNLOAD: "1"
        run: cargo test -p embed --features local-onnx real_download -- --nocapture
      - name: Real ort::init_from against the downloaded CPU flavor
        env:
          LOCALDB_TEST_ORT_DOWNLOAD: "1"
        run: cargo test -p embed --features local-onnx --test ort_init_download -- --nocapture
      - name: CUDA execution-provider probe fails cleanly without a GPU
        env:
          LOCALDB_TEST_ORT_DOWNLOAD: "1"
        run: cargo test -p embed --features local-onnx --test cuda_probe_gpuless -- --nocapture
      - name: Assert glibc/libstdc++ floor of downloaded ONNX Runtime libraries
        run: |
          set -euo pipefail
          CACHE_ROOT="$HOME/.cache/localdb/ort"
          echo "Scanning $CACHE_ROOT for shared libraries..."
          # This job only ever runs on Linux, so only .so* files are expected — the `.dylib`
          # exclusion is defensive/explicit documentation of intent (mirrors the old
          # release-workflow step this replaces, which scanned both platforms from one script).
          mapfile -t LIBS < <(find "$CACHE_ROOT" -type f -name '*.so*' ! -name '*.dylib' 2>/dev/null)
          if [ "${#LIBS[@]}" -eq 0 ]; then
            echo "ERROR: no .so libraries found under $CACHE_ROOT. The download steps above" \
                 "should have populated both the CPU and CUDA flavor directories — finding" \
                 "nothing here means this check would silently pass on nothing. Failing loudly" \
                 "instead (mirrors the old release-step's at-least-one-found assertion)."
            exit 1
          fi
          echo "Found ${#LIBS[@]} librarie(s):"
          printf '  %s\n' "${LIBS[@]}"

          MAX_GLIBC="0"
          MAX_GLIBCXX="0"
          for lib in "${LIBS[@]}"; do
            echo "== $lib =="
            glibc_ver=$(objdump -T "$lib" 2>/dev/null \
              | grep -oE 'GLIBC_[0-9]+\.[0-9]+(\.[0-9]+)?' | sed 's/GLIBC_//' \
              | sort -V | tail -1 || true)
            glibcxx_ver=$(objdump -T "$lib" 2>/dev/null \
              | grep -oE 'GLIBCXX_[0-9]+\.[0-9]+(\.[0-9]+)?' | sed 's/GLIBCXX_//' \
              | sort -V | tail -1 || true)
            echo "  max GLIBC_ requirement:   ${glibc_ver:-none}"
            echo "  max GLIBCXX_ requirement: ${glibcxx_ver:-none}"
            if [ -n "$glibc_ver" ]; then
              MAX_GLIBC=$(printf '%s\n%s\n' "$glibc_ver" "$MAX_GLIBC" | sort -V | tail -1)
            fi
            if [ -n "$glibcxx_ver" ]; then
              MAX_GLIBCXX=$(printf '%s\n%s\n' "$glibcxx_ver" "$MAX_GLIBCXX" | sort -V | tail -1)
            fi
          done

          echo "Workspace-wide max GLIBC_ requirement:   $MAX_GLIBC"
          echo "Workspace-wide max GLIBCXX_ requirement: $MAX_GLIBCXX"

          # Gate choice: Ubuntu 22.04 (this runner's own OS, and our documented support floor,
          # issue #133) ships glibc 2.35 and libstdc++ GLIBCXX_3.4.30. We deliberately gate at
          # today's empirically verified maxima across the pinned 1.24.4 libraries — GLIBC 2.27
          # (CPU x64/aarch64 and the CUDA main lib; providers_cuda itself needs only 2.2.5) and
          # GLIBCXX 3.4.22 — which sit well under that Ubuntu 22.04 ceiling. So a future ORT
          # version bump that raises either requirement trips this check long before the real
          # Ubuntu 22.04 / Mint 21 support floor is actually threatened.
          GLIBC_GATE="2.27"
          GLIBCXX_GATE="3.4.22"
          if [ "$(printf '%s\n%s\n' "$MAX_GLIBC" "$GLIBC_GATE" | sort -V | tail -1)" != "$GLIBC_GATE" ]; then
            echo "ERROR: downloaded ONNX Runtime libraries require GLIBC_$MAX_GLIBC, which" \
                 "exceeds the $GLIBC_GATE gate (today's empirically verified maximum, well" \
                 "under the Ubuntu 22.04 / issue #133 floor of 2.35 — investigate before raising)."
            exit 1
          fi
          if [ "$(printf '%s\n%s\n' "$MAX_GLIBCXX" "$GLIBCXX_GATE" | sort -V | tail -1)" != "$GLIBCXX_GATE" ]; then
            echo "ERROR: downloaded ONNX Runtime libraries require GLIBCXX_$MAX_GLIBCXX, which" \
                 "exceeds the $GLIBCXX_GATE gate (empirically verified ceiling)."
            exit 1
          fi
          echo "OK: glibc/libstdc++ requirements of downloaded ONNX Runtime libraries are within gates."
      - name: Run clippy on embed with local-onnx (deny warnings)
        # Note: the workspace-level `clippy` job (`cargo clippy --workspace --all-targets`)
        # already type-checks embed with `local-onnx` enabled — `cli`'s unconditional
        # `embed = { path = "../embed", features = ["local-onnx"] }` dependency means Cargo's
        # feature unification activates `local-onnx` for embed in that invocation too. This step
        # is intentionally redundant with that: it pins the exact package/feature combination on
        # this glibc-floor-pinned runner specifically, so a clippy regression scoped to
        # `embed --features local-onnx` (including this job's own new integration test file)
        # surfaces here even if workspace-level unification ever changes.
        run: cargo clippy -p embed --all-targets --features local-onnx -- -D warnings

  coreml:
    name: CoreML backend (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable with clippy
        # @stable satisfies the local-coreml MSRV of Rust 1.85.
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-coreml-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-coreml-
      - name: Build embed with local-coreml
        run: cargo build -p embed --features local-coreml
      - name: Run embed tests with local-coreml
        # Pure logic/unit tests run without a model. Device/network/parity tests
        # are #[ignore]d, so plain `cargo test` does not hit the network or load a
        # CoreML bundle; run those manually against a cached bundle.
        run: cargo test -p embed --features local-coreml
      - name: Run clippy with local-coreml (deny warnings)
        run: cargo clippy -p embed --features local-coreml --all-targets -- -D warnings
      - name: Download + verify CPU ONNX Runtime flavor (macOS, real network)
        # local-onnx (not local-coreml) deliberately: this exercises the same runtime-download
        # flavor table (issue #76) macOS falls back to when CoreML is unavailable, independent
        # of this job's main local-coreml build above. This test (`real_download_cpu_flavor`)
        # downloads into its own TempDir, not the real `~/Library/Caches/localdb/ort` cache dir,
        # so there is no cache step here to speed it up — every run re-downloads and
        # re-verifies the ~30 MB tarball from GitHub on purpose (that re-download/re-verify
        # behavior is what's under test).
        env:
          LOCALDB_TEST_ORT_DOWNLOAD: "1"
        run: cargo test -p embed --features local-onnx real_download_cpu_flavor -- --nocapture

  # Demonstrate the coverage gate: this job has a dummy function with a test.
  # The function and test live in the core crate (error.rs / tests).
  # If tests are removed, coverage will drop and the coverage job will fail.
  build-all-platforms:
    name: Cross-compile check (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          # Pinned to ubuntu-22.04 (not ubuntu-latest): our own Rust code inherits the
          # build machine's glibc floor, and this job now actually links (see the `cargo
          # build` step below), so a stale ubuntu-latest pin here would let a #133-style
          # glibc regression slip through CI again.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cross-compilation tools (aarch64-linux only)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-
      - name: Build localdb for target
        # `cargo check` never links, so it can't catch link-time/runtime issues like #133
        # (the GLIBC_2.38 floor from ort-sys's static archive) — that regression escaped CI
        # because this job used to only `cargo check`. Actually build+link the release
        # binary for each target instead.
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }} -p localdb

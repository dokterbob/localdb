name: CI

on:
  push:
    branches: ["main", "ticket/**"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# The toolchain, its components, and its cross-compile targets all come from
# `rust-toolchain.toml`. Runners ship with rustup, which reads that file and
# provisions on demand, so no job installs a toolchain of its own — a job that
# did would pin a *second*, different compiler and silently reintroduce the
# drift the file exists to prevent. `rustup show active-toolchain` is a
# named, cacheable step purely so provisioning failures and timings are legible
# in the log rather than folded into the first cargo command.

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          # The toolchain hash sits in the restore-key *prefix*, ahead of the
          # lockfile hash. A `target/` built by another compiler is unusable,
          # so a channel bump has to miss the prefix too — putting both hashes
          # in the exact key alone would still let the broad prefix restore the
          # previous compiler's artifacts. A lockfile change still restores
          # partially, within the same toolchain.
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Run clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # OIDC for the Qlty coverage upload (no token secret)
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          # Toolchain hash in the prefix — see the clippy job.
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-coverage-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Run coverage (all tests)
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Upload coverage to Qlty
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: qltysh/qlty-action/coverage@v2
        with:
          oidc: true
          files: lcov.info

  coreml:
    name: CoreML backend (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        # `rust-toolchain.toml`'s channel also has to satisfy the local-coreml
        # MSRV of Rust 1.85, which is above the workspace MSRV.
        run: rustup show active-toolchain
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          # Toolchain hash in the prefix — see the clippy job.
          key: ${{ runner.os }}-cargo-coreml-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-coreml-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Build embed with local-coreml
        run: cargo build -p localdb-embed --features local-coreml
      - name: Run embed tests with local-coreml
        # Pure logic/unit tests run without a model. Device/network/parity tests
        # are #[ignore]d, so plain `cargo test` does not hit the network or load a
        # CoreML bundle; run those manually against a cached bundle.
        run: cargo test -p localdb-embed --features local-coreml
      - name: Run clippy with local-coreml (deny warnings)
        run: cargo clippy -p localdb-embed --features local-coreml --all-targets -- -D warnings

  link-check:
    name: Check links (docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          # `--offline` alone never checks fragment anchors — `--include-fragments`
          # (bare, so it defaults to anchor-only) is what validates `file.md#anchor`
          # targets, both GitHub-style heading slugs and raw `<a id="...">` HTML
          # anchors. Both offline and deterministic, so this can gate PRs.
          #
          # docs/index.md and docs/_layouts/** are excluded: they contain raw
          # Liquid `{{ ... | relative_url }}` hrefs that are only real links once
          # Jekyll renders them, which would all be false positives here. The
          # built-site pass in pages.yml covers those instead.
          #
          # Shared excludes (e.g. localhost) live in ./lychee.toml, which lychee
          # auto-detects from the working directory — no --config flag needed.
          args: >-
            --offline --include-fragments --no-progress
            --exclude-path docs/index.md
            --exclude-path docs/_layouts
            README.md CLAUDE.md CONTRIBUTING.md VISION.md
            'docs/**/*.md' 'specs/**/*.md'

  # Demonstrate the coverage gate: this job has a dummy function with a test.
  # The function and test live in the core crate (error.rs / tests).
  # If tests are removed, coverage will drop and the coverage job will fail.
  build-all-platforms:
    name: Cross-compile check (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          # Pinned to ubuntu-22.04 (not ubuntu-latest): our own Rust code inherits the
          # build machine's glibc floor, and this job now actually links (see the `cargo
          # build` step below), so a stale ubuntu-latest pin here would let a #133-style
          # glibc regression slip through CI again.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        # Every target in this matrix is declared in `rust-toolchain.toml`, so
        # rustup provisions them here; adding a target to the matrix without
        # adding it there fails this step.
        run: rustup show active-toolchain
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cross-compilation tools (aarch64-linux only)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          # No toolchain hash here, unlike the jobs above: this caches only
          # downloaded sources, never `target/`, and those are the same bytes
          # whichever compiler consumes them.
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-
      - name: Build localdb for target
        # `cargo check` never links, so it can't catch link-time/runtime issues like #133
        # (the GLIBC_2.38 floor from ort-sys's static archive) — that regression escaped CI
        # because this job used to only `cargo check`. Actually build+link the release
        # binary for each target instead.
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }} -p localdb

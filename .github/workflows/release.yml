name: Release

# Triggered by a tag push matching `v*` (e.g. v0.1.0).
# Produces three release tarballs:
#   localdb-<version>-aarch64-apple-darwin.tar.gz
#   localdb-<version>-x86_64-unknown-linux-gnu.tar.gz
#   localdb-<version>-aarch64-unknown-linux-gnu.tar.gz
#
# See specs/06-roadmap.md §4 for the packaging roadmap.
# Note: Homebrew, launchd, and systemd are Phase ≥2 — not included here.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]*"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-release:
    name: Build release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon
          - os: macos-latest
            target: aarch64-apple-darwin
            cross: false

          # Linux x86_64 (native). Pinned to ubuntu-22.04 (not ubuntu-latest): our own Rust
          # code inherits the build machine's glibc floor, so building on a newer Ubuntu
          # would re-introduce issue #133 even though the embedded ONNX Runtime (build.rs)
          # is no longer the culprit. See "Verify glibc floor" step below.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            cross: false

          # Linux arm64 (cross-compiled via cross or cargo with linker). Also pinned to
          # ubuntu-22.04 for the same glibc-floor reason as above (#133).
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            cross: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (aarch64-linux only)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          # binutils-aarch64-linux-gnu provides aarch64-linux-gnu-objdump, used by the
          # "Verify glibc floor" step below to inspect the cross-compiled binary.
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-release-

      - name: Build release binary
        # CoreML is auto-enabled on aarch64-apple-darwin via cli/Cargo.toml's
        # [target.'cfg(target_os = "macos")'.dependencies] — no --features flag needed.
        # Linux targets build ONNX-only; the macOS target-dep is ignored on Linux.
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build --release --target ${{ matrix.target }} -p localdb

      - name: Strip binary (Linux/macOS)
        run: |
          BINARY=target/${{ matrix.target }}/release/localdb
          if [ -f "$BINARY" ]; then
            # Use target-specific strip for cross-compiled binaries.
            if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
              aarch64-linux-gnu-strip "$BINARY" || true
            else
              strip "$BINARY" || true
            fi
          fi

      - name: Verify no unexpected dynamic dependencies
        run: |
          BINARY=target/${{ matrix.target }}/release/localdb
          if [ "${{ runner.os }}" = "Linux" ] && [ "${{ matrix.cross }}" = "false" ]; then
            # Allow only: linux-vdso, libgcc_s, libc, libm, libdl, libpthread, ld-linux
            # (these are the platform baseline — no external shared libs like libssl)
            # Note: skip for cross-compiled aarch64 target (cannot run ldd on foreign arch binary).
            ldd "$BINARY" | tee /dev/stderr | \
              grep -vE '(linux-vdso|libgcc_s|libc\.|libm\.|libdl\.|libpthread|ld-linux|ld-musl)' | \
              grep -v "0x0" | \
              (! grep -q "=>")
            echo "Dynamic dependency check passed."
          fi
          if [ "${{ runner.os }}" = "macOS" ]; then
            otool -L "$BINARY" | tee /dev/stderr
            # Assert only system libraries are linked (no unexpected .dylib from /usr/local or /opt).
            if otool -L "$BINARY" | tail -n +2 | grep -vE '(/usr/lib/|/System/Library/|@rpath|@loader_path)'; then
              echo "ERROR: macOS binary has unexpected dynamic dependencies listed above." >&2
              exit 1
            fi
            echo "macOS dynamic dependency check passed."
          fi

      - name: Verify glibc floor (Linux)
        # Two independent glibc floors matter here (issue #133):
        #   1. Our own Rust code — set by the build machine, hence pinning both Linux
        #      matrix entries to ubuntu-22.04 above.
        #   2. The embedded ONNX Runtime .so (embed/build.rs downloads Microsoft's official
        #      build, verified offline to floor at GLIBC_2.27) — re-checked here as a
        #      regression guard in case the pinned version/asset ever changes.
        # Ubuntu 22.04 ships glibc 2.35, so both must stay at or below that.
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            OBJDUMP=$(command -v aarch64-linux-gnu-objdump || command -v objdump)
          else
            OBJDUMP=objdump
          fi
          echo "Using $OBJDUMP"

          check_glibc_floor() {
            local file="$1"
            local max
            max=$("$OBJDUMP" -T "$file" | grep -oE 'GLIBC_[0-9]+\.[0-9]+(\.[0-9]+)?' | sort -V -u | tail -1)
            echo "$file: max ${max:-<none found>}"
            if [ -n "$max" ]; then
              local ver="${max#GLIBC_}"
              local highest
              highest=$(printf '%s\n2.35\n' "$ver" | sort -V | tail -1)
              if [ "$highest" != "2.35" ]; then
                echo "ERROR: $file requires GLIBC > 2.35 (found $ver); Ubuntu 22.04 ships 2.35, so this would break on Mint 21 / Ubuntu 22.04. See issue #133." >&2
                exit 1
              fi
            fi
          }

          check_glibc_floor "target/${{ matrix.target }}/release/localdb"

          ORT_LIB=$(find target -path '*embed-*/out/*libonnxruntime*' -type f | head -1)
          if [ -z "$ORT_LIB" ]; then
            echo "ERROR: expected an embedded libonnxruntime under target/ for a local-onnx release build" >&2
            exit 1
          fi
          check_glibc_floor "$ORT_LIB"

      - name: Package tarball
        run: |
          VERSION="${GITHUB_REF_NAME}"
          TARNAME="localdb-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/${TARNAME}"
          cp "target/${{ matrix.target }}/release/localdb" "dist/${TARNAME}/"
          cp README.md LICENSE "dist/${TARNAME}/"
          tar -C dist -czf "dist/${TARNAME}.tar.gz" "${TARNAME}"
          echo "TARBALL=dist/${TARNAME}.tar.gz" >> "$GITHUB_ENV"
          echo "TARNAME=${TARNAME}" >> "$GITHUB_ENV"
          ls -lh "dist/${TARNAME}.tar.gz"

      - name: Verify binary runs after packaging
        # Cannot execute a cross-compiled ARM64 binary on the x86_64 runner.
        if: matrix.cross == false
        run: |
          ./target/${{ matrix.target }}/release/localdb --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TARNAME }}
          path: ${{ env.TARBALL }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: List artifacts
        run: find dist/ -type f | sort

      - name: Create GitHub Release and upload tarballs
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true

  smoke-test:
    name: Smoke test (${{ matrix.os }})
    needs: build-release
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04: proves the glibc-2.35 scenario from issue #133 (≈ Linux Mint 21.x)
        # end-to-end (extraction + dlopen + index + search), not just at link time.
        # ubuntu-latest: a current Linux, for good measure.
        # macos-latest: the embedded-runtime mechanism is identical on macOS now, so it
        # gets the same end-to-end proof.
        os: [ubuntu-22.04, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine artifact pattern for this OS
        id: artifact
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            echo "pattern=localdb-*-aarch64-apple-darwin" >> "$GITHUB_OUTPUT"
          else
            echo "pattern=localdb-*-x86_64-unknown-linux-gnu" >> "$GITHUB_OUTPUT"
          fi

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          pattern: "${{ steps.artifact.outputs.pattern }}"
          path: dist/

      - name: Install binary from tarball
        run: |
          TARBALL=$(find dist/ -name "*.tar.gz" | head -1)
          tar -xzf "$TARBALL" -C /tmp/
          BINDIR=$(find /tmp -name "localdb" -type f | head -1 | xargs dirname)
          echo "$BINDIR" >> "$GITHUB_PATH"

      - name: Run smoke test script
        run: bash smoke_test.sh

[workspace]
members = [
    "core",
    "extract",
    "fetch",
    "ingest",
    "store-libsql",
    "embed",
    "server",
    "mcp",
    "cli",
    "localdb",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/dokterbob/localdb"
homepage = "https://github.com/dokterbob/localdb"
rust-version = "1.88"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["json"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }

# CLI argument parsing
clap = { version = "4", features = ["derive", "color", "env", "string"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# ID generation
ulid = { version = "1", features = ["serde"] }

# Hashing
blake3 = "1"

# Async utilities
futures = "0.3"
async-trait = "0.1"
# `tokio_util::sync::CancellationToken` (issue #218) — per-job cooperative
# cancellation signal the job queue races a running job's future against.
# Already resolved transitively (a dependency of `axum`/`tokio` itself); this
# adds a direct dependency for `server`, not a new crate to the graph.
tokio-util = "0.7"

# Platform paths
directories = "6"
dirs = "6"

# libSQL (Turso's SQLite fork) — async, DiskANN vectors, FTS5
libsql = "=0.10.0-pre.4"

# URL parsing
url = "2"
percent-encoding = "2"

# Hashing for policy_version
hex = "0.4"

# Progress bars and spinners
indicatif = "0.17"

# Test utilities
tempfile = "3"

# MCP (Model Context Protocol) SDK
rmcp = "1.8"
schemars = { version = "1.0", features = ["preserve_order"] }

# Retry / rate limiting / HTTP date parsing
backon = { version = "1.6", default-features = false, features = ["std", "tokio-sleep"] }
governor = { version = "0.10", default-features = false, features = ["std", "dashmap"] }
httpdate = "1.0"
# `http`'s types only — `core` uses `HeaderValue` to validate operator-supplied
# header values at config-load time rather than at first request. Already in
# the graph transitively via reqwest/axum, so this adds no new dependency.
http = "1"

# Internal crates
localdb-core = { path = "core", version = "=0.1.0" }
extract = { path = "extract", version = "=0.1.0" }
fetch = { path = "fetch", version = "=0.1.0" }
ingest = { path = "ingest", version = "=0.1.0" }
store-libsql = { path = "store-libsql", version = "=0.1.0" }
embed = { path = "embed", version = "=0.1.0" }
server = { path = "server", version = "=0.1.0" }
mcp = { path = "mcp", version = "=0.1.0" }
cli = { path = "cli", version = "=0.1.0" }

[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"

# The profile cargo-dist builds release artifacts with; stripping here
# replaces the release pipeline's manual `strip` step.
[profile.dist]
inherits = "release"
strip = true

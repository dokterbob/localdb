[package]
name = "localdb-extract"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Format detection and extraction to a normalized Markdown document"

[lib]
# Keep the short crate name in code (`use extract::…`); only the
# package name is namespaced (crates.io collision hygiene — see docs/release-engineering.md).
name = "extract"

[dependencies]
localdb-core = { path = "../core", version = "0.2.0" }

# Markdown parsing
pulldown-cmark = "0.13"

# HTML parsing
scraper = "0.27"
# JSON-LD (script[type="application/ld+json"]) date extraction (issue #251).
serde_json = { workspace = true }

# PDF text extraction and Markdown conversion.
# Exact-pinned: 0.3.x is pre-1.0 with rapid API churn; bump deliberately, with
# the fixture suite in tests/ as the validation gate. Default features are
# `icc` + `legacy-crypto` only — no `ocr`, so no `ort` dependency (issue #133).
pdf_oxide = { version = "=0.3.77" }

# Office format conversion (DOCX, PPTX, XLSX, XLS, CSV → Markdown)
anytomd = { version = "1.3.0", default-features = false }

# MIME type sniffing
infer = "0.16"
mime_guess = "2"
# EPUB parsing — read-only, so default features (write/threadsafe/prelude) are off.
rbook = { version = "0.7", default-features = false }

# BOM-sniffing UTF-8/UTF-16LE/UTF-16BE decode for docProps/core.xml (issue
# #251): some producers write it as UTF-16. Already transitive at 0.8.35 via
# pdf_oxide/anytomd; the bare "0.8" range is compatible with that pin.
encoding_rs = "0.8"

# Office (docx/pptx) docProps/core.xml extraction. Kept on the same 0.x minor
# rbook resolves to, so this adds no extra quick-xml copy to the binary; move
# it with rbook's when that changes. 0.x minors are semver-breaking, so an
# exact pin is what makes the match hold rather than happen to.
quick-xml = "=0.42.0"
# docx/pptx are zip containers, opened to read docProps/core.xml at extraction
# time. Kept on the same major as rbook's (and anytomd's) zip, so the binary
# carries one zip, not two.
zip = { version = "9", default-features = false, features = ["deflate"] }

tracing = { workspace = true }

[package]
name = "localdb-extract"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Format detection and extraction to a normalized Markdown document"

[lib]
# Keep the short crate name in code (`use extract::…`); only the
# package name is namespaced (crates.io collision hygiene — see docs/release-engineering.md).
name = "extract"

[dependencies]
localdb-core = { path = "../core", version = "0.1.0" }

# Markdown parsing
pulldown-cmark = "0.13"

# HTML parsing
scraper = "0.27"
# JSON-LD (script[type="application/ld+json"]) date extraction (issue #251).
serde_json = { workspace = true }

# PDF text extraction and Markdown conversion.
# Exact-pinned: 0.3.x is pre-1.0 with rapid API churn; bump deliberately, with
# the fixture suite in tests/ as the validation gate. Default features are
# `icc` + `legacy-crypto` only — no `ocr`, so no `ort` dependency (issue #133).
pdf_oxide = { version = "=0.3.77" }

# Office format conversion (DOCX, PPTX, XLSX, XLS, CSV → Markdown)
anytomd = { version = "1.3.0", default-features = false }

# MIME type sniffing
infer = "0.16"
mime_guess = "2"
# EPUB parsing — read-only, so default features (write/threadsafe/prelude) are off.
rbook = { version = "0.7", default-features = false }

# Office (docx/pptx) docProps/core.xml extraction (issue #251). Exact-pinned
# to rbook's already-compiled 0.40.1 so only ONE quick-xml major ships in the
# binary — a bare "0.40" would let cargo pick a different 0.40.x that still
# happens to satisfy rbook's own requirement, but pinning removes the
# ambiguity outright.
quick-xml = "=0.40.1"
# docx/pptx are zip containers; promoted from a test-only dev-dependency
# (issue #251) to open docProps/core.xml at extraction time. Pinned to major
# 8 to match rbook's transitive zip 8.6.0 — the 2.x pin previously used only
# in tests would otherwise compile two zip majors into the binary.
zip = { version = "8", default-features = false, features = ["deflate"] }

tracing = { workspace = true }

[package]
name = "localdb-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Domain model, search orchestration, traits"

[features]
test-support = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
ulid = { workspace = true }
blake3 = { workspace = true }
async-trait = { workspace = true }
directories = { workspace = true }
dirs = { workspace = true }
hex = { workspace = true }
url = { workspace = true }
percent-encoding = { workspace = true }
text-splitter = { version = "0.31", features = ["markdown"] }
pulldown-cmark = "0.13"
globset = "0.4"
schemars = { workspace = true }
http = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
tempfile = "3"
localdb-extract = { path = "../extract" }
# default-features off: the default `resolve-http` feature drags reqwest 0.13
# into the test build graph with `rustls-no-provider`, which breaks rmcp's
# daemon-proxy client under `cargo test` (rustls provider ambiguity; CI-only
# on Linux). Our schema validation is fully in-memory — no resolvers needed.
jsonschema = { version = "0.49", default-features = false }

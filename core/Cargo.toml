[package]
name = "localdb-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Domain model, search orchestration, traits"

[features]
test-support = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
ulid = { workspace = true }
blake3 = { workspace = true }
async-trait = { workspace = true }
directories = { workspace = true }
dirs = { workspace = true }
hex = { workspace = true }
chrono = { workspace = true }
url = { workspace = true }
percent-encoding = { workspace = true }
text-splitter = { version = "0.31", features = ["markdown"] }
pulldown-cmark = "0.13"
globset = "0.4"
schemars = { workspace = true }
http = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
tempfile = "3"
localdb-extract = { path = "../extract" }
# Self dev-dependency, `test-support` feature only: `core/tests/*.rs`
# integration tests link against this crate as an ordinary dependency (no
# `cfg(test)`), so `FakeStore` — gated `cfg(any(test, feature =
# "test-support"))` because it's also used by other crates' integration
# tests (`ingest`, which already depends on this same feature) — needs the
# feature turned on explicitly here too. Mirrors `ingest/Cargo.toml`'s
# `localdb-core = { path = "../core", features = ["test-support"] }`.
localdb-core = { path = ".", features = ["test-support"] }
# default-features off: the default `resolve-http` feature drags reqwest 0.13
# into the test build graph with `rustls-no-provider`, which breaks rmcp's
# daemon-proxy client under `cargo test` (rustls provider ambiguity; CI-only
# on Linux). Our schema validation is fully in-memory — no resolvers needed.
jsonschema = { version = "0.49", default-features = false }

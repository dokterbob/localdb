# yamllint's default 80-column limit is tighter than this repo's style;
# match the 100-column docs convention with headroom for long CI expressions.
extends: default
rules:
  line-length:
    max: 120
  # Repo convention is no `---` document-start marker (workflows, issue
  # templates, and config.template.yaml all omit it).
  document-start: disable
  # Don't flag GitHub workflows' `on:` key as a truthy value.
  truthy:
    check-keys: false

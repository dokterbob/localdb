[package]
name = "mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "MCP server (stdio and HTTP): read-only search, get_document, get_chunks, list_stores"

[dependencies]
localdb-core = { path = "../core" }
async-trait = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
anyhow = { workspace = true }
rmcp = { workspace = true, features = [
    "server",
    "transport-io",
    "transport-streamable-http-server",
    "macros",
    "client",
    "transport-streamable-http-client-reqwest",
] }

[dev-dependencies]
localdb-core = { path = "../core", features = ["test-support"] }

# Real HTTP server + listener for the proxy-transparency test
# (mcp/tests/mcp_proxy.rs), which needs a genuine socket for rmcp's
# Streamable HTTP client transport — not used by any non-test code, which
# only ever gets a concrete tower::Service back from
# `build_streamable_http_service` (see `http.rs`).
axum = { workspace = true }

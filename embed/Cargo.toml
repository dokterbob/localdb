[package]
name = "embed"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Embedder implementations: local ONNX, OpenAI-compatible, and contextualized providers"

[features]
default = []
# Enable local ONNX inference via fastembed + direct ORT (pplx-embed-v1-0.6b)
local-onnx = ["dep:fastembed", "dep:ort", "dep:tokenizers", "dep:ndarray"]
# Enable local CoreML inference (macOS/Apple Silicon only)
local-coreml = ["dep:objc2", "dep:objc2-core-ml", "dep:objc2-foundation", "dep:half", "dep:tokenizers", "dep:hf-hub", "dep:block2"]

[dependencies]
localdb-core = { path = "../core", version = "=0.1.0" }
thiserror = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
async-trait = "0.1"

# HTTP client for hosted providers
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Shared outgoing-HTTP layer (issue #207): user agent, retry/backoff/jitter,
# and Retry-After handling for hosted-provider requests. `fetch` depends only
# on `localdb-core`, so pulling it in here does not create a dependency
# cycle — see `fetch/Cargo.toml`.
fetch = { workspace = true }
backon = { workspace = true }

# Local ONNX inference (optional)
# hf-hub-rustls-tls enables model downloading via HuggingFace Hub (includes hf-hub + rustls)
#
# We deliberately do NOT enable any `ort-download-binaries*` fastembed feature. That feature
# makes `ort-sys` statically link pyke.io's prebuilt ONNX Runtime archive, which is built with
# GCC 14 on Ubuntu 24.04 and references `__isoc23_strtol*` symbols → GLIBC >= 2.38 floor on the
# *release binary itself*, breaking startup on older glibc distros (Mint 21, Ubuntu 22.04).
# See issue #133 and pykeio/ort#523 (unresolved upstream). Instead we use `ort`'s
# `load-dynamic` (dlopen) below and embed Microsoft's official ONNX Runtime build ourselves
# (embed/build.rs) — no ONNX Runtime ABI ends up baked into our executable at all.
fastembed = { version = "5", default-features = false, features = ["hf-hub-rustls-tls"], optional = true }

# For model cache path management
dirs = "5"

# SHA2 for checksum verification
sha2 = "0.10"
hex = "0.4"

# Streaming HTTP download support (also needed by pplx_onnx).
futures-util = "0.3"
# CRITICAL: default-features = false. ort's defaults include `download-binaries` (pulls in the
# pyke static archive we're removing above) AND `api-24` (pins the ONNX Runtime C API version,
# which would hard-require a >=1.24 runtime and break `ORT_DYLIB_PATH` overrides pointing at
# older libraries). We request no `api-*` feature so `ort` multiversions across ONNX Runtime
# 1.17-1.24. NOTE: fastembed 5.17.2's own (unconditional, not feature-gated) `ort` dependency
# declaration requests `api-24` regardless of which fastembed features we enable — Cargo feature
# unification means api-24 ends up enabled anyway as long as fastembed is in the graph. That's
# fine because we pin the embedded runtime to 1.24.4 (build.rs), but it does mean the
# `ORT_DYLIB_PATH`/`LOCALDB_ORT_LIB` escape hatches require ONNX Runtime >= 1.24, not the full
# 1.17-1.24 range `ort` alone would otherwise support. See embed/src/ort_runtime.rs.
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "tracing", "load-dynamic"], optional = true }
tokenizers = { version = "0.22", optional = true }
ndarray = { version = "0.17", optional = true }

# CoreML inference (macOS only, optional)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-core-ml = { version = "0.3", optional = true }
objc2-foundation = { version = "0.3", optional = true }
half = { version = "2", optional = true }
block2 = { version = "0.6", optional = true }
# Async HF Hub client for CoreML bundle download (XET-deduped, pinned revisions)
hf-hub = { version = "1.0.0-rc.1", default-features = false, features = ["rustls-tls"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# Mock HTTP server for testing hosted providers
wiremock = "0.6"
tempfile = "3"

# build.rs downloads and verifies the embedded ONNX Runtime shared library (see build.rs and
# embed/src/ort_runtime.rs). ureq is rustls-based and follows redirects (GitHub release assets
# redirect to objects.githubusercontent.com).
[build-dependencies]
# ureq's "tls" feature (despite the generic name) wires up its rustls-based TLS backend
# (webpki + webpki-roots + rustls) with no native-tls/OpenSSL dependency.
ureq = { version = "2", default-features = false, features = ["tls"] }
sha2 = "0.10"
hex = "0.4"
flate2 = "1"
tar = "0.4"

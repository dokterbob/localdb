[package]
name = "localdb-store-libsql"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[lib]
# Keep the short crate name in code (`use store_libsql::…`); only the
# package name is namespaced (crates.io collision hygiene — see docs/release-engineering.md).
name = "store_libsql"

[features]
# Mirrors `localdb-core`'s own `test-support` feature (see
# `core/Cargo.toml`): gates test-only escape hatches that reach past the
# `RetrievalStore`/`StoreBackend` trait surface, for integration tests in
# other crates (e.g. `server/src/job_exec/tests/`) that need them but don't
# compile this crate's own `#[cfg(test)]` code.
test-support = []

[dependencies]
localdb-core = { path = "../core", version = "0.2.1" }
libsql = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
blake3 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
chrono = { workspace = true }
# `test-support` feature on our own already-normal dependency: unlocks
# `localdb_core::auth::contract` and the `auth_store_contract_tests!` macro
# (core/src/auth/contract/mod.rs) for `store-libsql/src/auth/contract_tests.rs`,
# which runs the same behavioral contract against `LibsqlAuthStore` that
# `core` runs against `FakeAuthStore`. Mirrors `server/Cargo.toml`'s
# identical pattern for `localdb-store-libsql`'s own `test-support` feature.
localdb-core = { path = "../core", features = ["test-support"] }

[package]
name = "localdb-store-libsql"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[lib]
# Keep the short crate name in code (`use store_libsql::…`); only the
# package name is namespaced (crates.io collision hygiene — see docs/release-engineering.md).
name = "store_libsql"

[dependencies]
localdb-core = { path = "../core", version = "0.1.0" }
libsql = "0.10.0-pre.4"
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
blake3 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
chrono = { workspace = true }
